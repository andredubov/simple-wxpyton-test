name: Build Release

on:
  release:
    types: [published]

env:
  APP_NAME: 'myapp'
  COMPANY_NAME: 'https://github.com/andredubov'
  PRODUCT_VERSION: '1.0.0.0'
  FILE_VERSION: '1.0.0.0'
  BUILD_DIR: '.build'
  ICON_FILE_PATH: '.\assets\graph-report.ico'
  SPLASH_SCREEN_FILE_PATH: '.\assets\logo.png'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            shell: powershell
            python-version: '3.11'
            python-arch: 'x64'
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            shell: powershell
            python-version: '3.7.9'
            python-arch: 'x86'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
        shell: powershell

      - name: Build with Nuitka
        if: matrix.os == 'windows-latest'
        run: |
          $nuitkaArgs = @(
            "--mode=onefile"
            "--windows-console-mode=disable"
            "--assume-yes-for-downloads"
            "--include-package=wx"
            "--include-package-data=wx"
            "--noinclude-unittest-mode=nofollow"
            "--noinclude-setuptools-mode=nofollow"
            "--company-name=${{ env.COMPANY_NAME }}"
            "--product-name=${{ env.APP_NAME }}"
            "--windows-file-version=${{ env.FILE_VERSION }}"
            "--windows-product-version=${{ env.PRODUCT_VERSION }}"
            "--output-dir=.\${{ env.BUILD_DIR }}"
            "--output-filename=${{ env.APP_NAME }}${{ matrix.script-ext }}"
            "--windows-icon-from-ico=${{ env.ICON_FILE_PATH }}"
            "--onefile-windows-splash-screen-image=${{ env.SPLASH_SCREEN_FILE_PATH }}"
            ".\main.py"
          )
          python -m nuitka $nuitkaArgs
        shell: powershell

      - name: Upload asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ format('./${{ env.BUILD_DIR }}/{0}/{1}{2}', matrix.os, env.APP_NAME, matrix.script-ext)}}
          asset_name: ${{ format('{0}-{1}-{2}-{3}{4}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name, matrix.script-ext) }}
          asset_content_type: application/octet-stream