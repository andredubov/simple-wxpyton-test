name: Build Release

on:
  release:
    types: [published]

env:
  APP_NAME: 'myapp'
  COMPANY_NAME: 'https://github.com/andredubov'
  PRODUCT_VERSION: '1.0.0'
  FILE_VERSION: '1.0.0'
  BUILD_DIR: '.build'
  ICON_FILE_PATH: './assets/graph-report.ico'
  SPLASH_SCREEN_FILE_PATH: './assets/logo.png'
  MACOS_ICON_PATH: './assets/graph-report.icns'
  MACOS_BACKGROUND_PATH: './assets/dmg-background.png'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            python-version: '3.11'
            python-arch: 'x64'
            build-dir: 'windows-x64'
            requirements-path: './requirements/x64/requirements.txt'
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            python-version: '3.7.9'
            python-arch: 'x86'
            build-dir: 'windows-x86'
            requirements-path: './requirements/x86/requirements.txt'
          # macOS builds
          - os: macos-latest
            os-name: macos
            script-ext: ''
            python-version: '3.11'
            python-arch: 'x64'
            build-dir: 'macos-x64'
            requirements-path: './requirements/x64/requirements.txt'
          - os: macos-latest
            os-name: macos
            script-ext: ''
            python-version: '3.11'
            python-arch: 'arm64'
            build-dir: 'macos-arm64'
            requirements-path: './requirements/x64/requirements.txt'

    steps:
      - uses: actions/checkout@v4

      - name: Check required files (Windows)
        if: matrix.os-name == 'windows'
        run: |
          $iconPath = "${{ env.ICON_FILE_PATH }}"
          $splashPath = "${{ env.SPLASH_SCREEN_FILE_PATH }}"
          $mainPath = "./main.py"
          $requirementsPath = "${{ matrix.requirements-path }}"

          Write-Host "Checking required files..."
          Write-Host "Icon: $iconPath"
          Write-Host "Splash: $splashPath" 
          Write-Host "Main script: $mainPath"
          Write-Host "Requirements: $requirementsPath"

          if (!(Test-Path $iconPath)) {
            Write-Error "❌ Icon file not found: $iconPath"
            exit 1
          }
          if (!(Test-Path $splashPath)) {
            Write-Error "❌ Splash screen file not found: $splashPath"
            exit 1
          }
          if (!(Test-Path $mainPath)) {
            Write-Error "❌ Main script not found: $mainPath"
            exit 1
          }
          if (!(Test-Path $requirementsPath)) {
            Write-Error "❌ Requirements file not found: $requirementsPath"
            exit 1
          }

          Write-Host "All required files found"
        shell: pwsh

      - name: Check required files (macOS)
        if: matrix.os-name == 'macos'
        run: |
          echo "Checking required files..."
          echo "Icon: ${{ env.ICON_FILE_PATH }}"
          echo "macOS Icon: ${{ env.MACOS_ICON_PATH }}"
          echo "Splash: ${{ env.SPLASH_SCREEN_FILE_PATH }}"
          echo "DMG Background: ${{ env.MACOS_BACKGROUND_PATH }}"
          echo "Main script: ./main.py"
          echo "Requirements: ${{ matrix.requirements-path }}"

          # Проверяем основные файлы
          if [ ! -f "./main.py" ]; then
            echo "❌ Main script not found: ./main.py"
            exit 1
          fi
          if [ ! -f "${{ matrix.requirements-path }}" ]; then
            echo "❌ Requirements file not found: ${{ matrix.requirements-path }}"
            exit 1
          fi

          # Проверяем файлы для сборки
          if [ ! -f "${{ env.ICON_FILE_PATH }}" ]; then
            echo "⚠️  Windows icon file not found: ${{ env.ICON_FILE_PATH }}"
          fi
          if [ ! -f "${{ env.MACOS_ICON_PATH }}" ]; then
            echo "⚠️  macOS icon file not found: ${{ env.MACOS_ICON_PATH }} - will try to use Windows icon"
          fi
          if [ ! -f "${{ env.SPLASH_SCREEN_FILE_PATH }}" ]; then
            echo "⚠️  Splash screen file not found: ${{ env.SPLASH_SCREEN_FILE_PATH }}"
          fi
          if [ ! -f "${{ env.MACOS_BACKGROUND_PATH }}" ]; then
            echo "⚠️  DMG background file not found: ${{ env.MACOS_BACKGROUND_PATH }} - will create DMG without background"
          fi

          echo "All required files found"
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-arch }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.python-arch }}-${{ hashFiles(matrix.requirements-path) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.python-arch }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies (Windows)
        if: matrix.os-name == 'windows'
        run: |
          python -m pip install --upgrade pip
          Write-Host "Installing dependencies from: ${{ matrix.requirements-path }}"
          pip install -r "${{ matrix.requirements-path }}"
        shell: powershell

      - name: Install dependencies (macOS)
        if: matrix.os-name == 'macos'
        run: |
          python -m pip install --upgrade pip
          echo "Installing dependencies from: ${{ matrix.requirements-path }}"
          python -m pip install -r "${{ matrix.requirements-path }}"
          python -m pip install imageio
        shell: bash

      - name: Build with Nuitka (Windows)
        if: matrix.os-name == 'windows'
        run: |
          # Create build directory
          $buildPath = "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}"
          $appName = "${{ env.APP_NAME }}${{ matrix.script-ext }}"
          New-Item -ItemType Directory -Force -Path $buildPath
          
          Write-Host "Starting Nuitka build for ${{ matrix.python-version }} (${{ matrix.python-arch }})..."
          Write-Host "Build output: $buildPath"

          $nuitkaArgs = @(
            "--mode=app"
            "--windows-console-mode=disable"
            "--assume-yes-for-downloads"
            "--include-package=wx"
            "--include-package-data=wx"
            "--noinclude-unittest-mode=nofollow"
            "--noinclude-setuptools-mode=nofollow"
            "--company-name=${{ env.COMPANY_NAME }}"
            "--product-name=${{ env.APP_NAME }}"
            "--windows-file-version=${{ env.FILE_VERSION }}"
            "--windows-product-version=${{ env.PRODUCT_VERSION }}"
            "--output-dir=$buildPath"
            "--output-filename=$appName"
            "--windows-icon-from-ico=${{ env.ICON_FILE_PATH }}"
            "--onefile-windows-splash-screen-image=${{ env.SPLASH_SCREEN_FILE_PATH }}"
            "./main.py"
          )

          Write-Host "Nuitka command: python -m nuitka $nuitkaArgs"
          python -m nuitka @nuitkaArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Nuitka build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        shell: powershell

      - name: Build with Nuitka (macOS)
        if: matrix.os-name == 'macos'
        run: |
          # Create build directory
          build_path="./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}"
          app_name="${{ env.APP_NAME }}"
          mkdir -p "$build_path"
          
          echo "Starting Nuitka build for ${{ matrix.python-version }} (${{ matrix.python-arch }})..."
          echo "Build output: $build_path"

          # Определяем какой файл иконки использовать
          if [ -f "${{ env.MACOS_ICON_PATH }}" ]; then
            icon_path="${{ env.MACOS_ICON_PATH }}"
            echo "Using macOS icon: $icon_path"
          else
            icon_path="${{ env.ICON_FILE_PATH }}"
            echo "Using Windows icon as fallback: $icon_path"
          fi

          # For macOS, we use different Nuitka arguments
          nuitka_args=(
            "--mode=app"
            "--assume-yes-for-downloads"
            "--include-package=wx"
            "--include-package-data=wx"
            "--include-module=_bisect"
            "--include-module=_json"
            "--noinclude-unittest-mode=nofollow"
            "--noinclude-setuptools-mode=nofollow"
            "--company-name=${{ env.COMPANY_NAME }}"
            "--product-name=${{ env.APP_NAME }}"
            "--output-dir=$build_path"
            "--macos-app-name=$app_name"
            "--macos-app-icon=$icon_path"
            "--macos-app-version=${{ env.PRODUCT_VERSION }}"
            "./main.py"
          )

          echo "Nuitka command: python -m nuitka ${nuitka_args[@]}"
          python -m nuitka "${nuitka_args[@]}"
          
          if [ $? -ne 0 ]; then
            echo "❌ Nuitka build failed"
            exit 1
          fi

          echo "Checking build results..."
          ls -la "$build_path/"
          
          # If main.app was created instead of myapp.app, rename it
          if [ -d "$build_path/main.app" ] && [ ! -d "$build_path/$app_name.app" ]; then
            echo "Renaming main.app to $app_name.app"
            mv "$build_path/main.app" "$build_path/$app_name.app"
          fi
          
          # Final verification
          if [ -d "$build_path/$app_name.app" ]; then
            echo "✓ App bundle created successfully: $app_name.app"
          else
            echo "❌ App bundle not found with expected name"
            echo "Available .app bundles:"
            find "$build_path" -name "*.app" -type d
            exit 1
          fi
        shell: bash

      - name: Verify build result (Windows)
        if: matrix.os-name == 'windows'
        run: |
          $exePath = "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/${{ env.APP_NAME }}${{ matrix.script-ext }}"
          Write-Host "Verifying build result: $exePath"
          
          if (Test-Path $exePath) {
            $fileInfo = Get-Item $exePath
            $fileSize = [math]::Round($fileInfo.Length / 1MB, 2)
            Write-Host "✓ Build successful!"
            Write-Host "  File: $($fileInfo.Name)"
            Write-Host "  Size: $fileSize MB"
            Write-Host "  Path: $($fileInfo.FullName)"
            Write-Host "  Modified: $($fileInfo.LastWriteTime)"
          } else {
            Write-Error "❌ Build failed: Executable not found at $exePath"
            # List directory contents for debugging
            Write-Host "Directory contents:"
            Get-ChildItem "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/" -Recurse | Format-Table Name, Length
            exit 1
          }
        shell: pwsh

      - name: Verify build result (macOS)
        if: matrix.os-name == 'macos'
        run: |
          build_path="./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/${{ env.APP_NAME }}.app"
          echo "Verifying build result: $build_path"
          
          if [ -d "$build_path" ]; then
            echo "✓ Build successful!"
            echo "  File: ${{ env.APP_NAME }}.app"
            echo "  Path: $build_path"
            # Get file size
            if command -v du &> /dev/null; then
              size=$(du -sh "$build_path" | cut -f1)
              echo "  Size: $size"
            fi
            # Show that it's a valid app bundle
            if [ -d "$build_path/Contents" ]; then
              echo "  Valid app bundle structure detected"
              echo "  Contents:"
              find "$build_path/Contents" -type f | head -10
            fi
          else
            echo "❌ Build failed: App bundle not found at $build_path"
            # List directory contents for debugging
            echo "Directory contents:"
            ls -la "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/"
            echo "Looking for any .app bundles:"
            find "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/" -name "*.app" -type d
            exit 1
          fi
        shell: bash

      - name: Install DMG creation tools (macOS)
        if: matrix.os-name == 'macos'
        run: |
          # Install create-dmg if not available
          if ! command -v create-dmg &> /dev/null; then
            echo "Installing create-dmg..."
            brew install create-dmg
          fi
          
          # Verify installation
          create-dmg --version
        shell: bash

      - name: Create DMG file (macOS)
        if: matrix.os-name == 'macos'
        run: |
          build_path="./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}"
          app_name="${{ env.APP_NAME }}"
          dmg_name="${{ format('{0}-{1}-{2}-{3}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name) }}"
          
          echo "Creating DMG file..."
          echo "App path: $build_path/$app_name.app"
          echo "Output: $build_path/${dmg_name}.dmg"
          
          # Проверяем существование .app бандла
          if [ ! -d "$build_path/$app_name.app" ]; then
            echo "❌ App bundle not found: $build_path/$app_name.app"
            exit 1
          fi

          # Сначала пробуем create-dmg с бэкграундом если есть
          if [ -f "${{ env.MACOS_BACKGROUND_PATH }}" ]; then
            echo "Creating DMG with background..."
            create-dmg \
              --volname "$app_name" \
              --volicon "${{ env.MACOS_ICON_PATH }}" \
              --background "${{ env.MACOS_BACKGROUND_PATH }}" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$app_name.app" 150 190 \
              --hide-extension "$app_name.app" \
              --app-drop-link 450 190 \
              --no-internet-enable \
              "$build_path/${dmg_name}.dmg" \
              "$build_path/$app_name.app" || echo "create-dmg with background failed, trying without..."
          fi
          
          # Если create-dmg не сработал или нет бэкграунда, пробуем простую версию
          if [ ! -f "$build_path/${dmg_name}.dmg" ]; then
            echo "Creating simple DMG..."
            create-dmg \
              --volname "$app_name" \
              --icon "$app_name.app" 150 190 \
              --app-drop-link 450 190 \
              --no-internet-enable \
              "$build_path/${dmg_name}.dmg" \
              "$build_path/$app_name.app" || echo "create-dmg failed, using hdiutil..."
          fi
          
          # Fallback: используем hdiutil если create-dmg не сработал
          if [ ! -f "$build_path/${dmg_name}.dmg" ]; then
            echo "Using hdiutil as fallback..."
            hdiutil create \
              -volname "$app_name" \
              -srcfolder "$build_path/$app_name.app" \
              -ov \
              -format UDZO \
              -imagekey zlib-level=9 \
              "$build_path/${dmg_name}.dmg"
          fi
          
          # Verify DMG was created
          if [ -f "$build_path/${dmg_name}.dmg" ]; then
            echo "✓ DMG created successfully: ${dmg_name}.dmg"
            echo "File size: $(du -h "$build_path/${dmg_name}.dmg" | cut -f1)"
            # Show DMG info
            hdiutil imageinfo "$build_path/${dmg_name}.dmg" 2>/dev/null || echo "Could not get DMG info"
          else
            echo "❌ DMG creation failed"
            exit 1
          fi
        shell: bash

      - name: Upload asset (Windows)
        if: matrix.os-name == 'windows'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ format('./{0}/{1}/{2}{3}', env.BUILD_DIR, matrix.build-dir, env.APP_NAME, matrix.script-ext) }}
          asset_name: ${{ format('{0}-{1}-{2}-{3}{4}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name, matrix.script-ext) }}
          asset_content_type: application/octet-stream

      - name: Upload DMG asset (macOS)
        if: matrix.os-name == 'macos'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ format('./{0}/{1}/{2}-{3}-{4}-{5}.dmg', env.BUILD_DIR, matrix.build-dir, env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name) }}
          asset_name: ${{ format('{0}-{1}-{2}-{3}.dmg', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name) }}
          asset_content_type: application/x-apple-diskimage

      - name: Show upload confirmation (Windows)
        if: matrix.os-name == 'windows'
        run: |
          $assetName = "${{ format('{0}-{1}-{2}-{3}{4}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name, matrix.script-ext) }}"
          Write-Host "Asset uploaded successfully: $assetName"
        shell: powershell

      - name: Show upload confirmation (macOS)
        if: matrix.os-name == 'macos'
        run: |
          assetName="${{ format('{0}-{1}-{2}-{3}.dmg', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name) }}"
          echo "DMG asset uploaded successfully: $assetName"
        shell: bash