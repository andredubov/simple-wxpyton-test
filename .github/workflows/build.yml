name: Build Release

on:
  release:
    types: [published]

env:
  APP_NAME: 'myapp'
  COMPANY_NAME: 'https://github.com/andredubov'
  PRODUCT_VERSION: '1.0.0.0'
  FILE_VERSION: '1.0.0.0'
  BUILD_DIR: '.build'
  ICON_FILE_PATH: './assets/graph-report.ico'
  SPLASH_SCREEN_FILE_PATH: './assets/logo.png'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            shell: powershell
            python-version: '3.11'
            python-arch: 'x64'
            build-dir: 'windows-x64'
            requirements-path: './requirements/x64/requirements.txt'
          - os: windows-latest
            os-name: windows
            script-ext: '.exe'
            shell: powershell
            python-version: '3.7.9'
            python-arch: 'x86'
            build-dir: 'windows-x86'
            requirements-path: './requirements/x86/requirements.txt'

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          $iconPath = "${{ env.ICON_FILE_PATH }}"
          $splashPath = "${{ env.SPLASH_SCREEN_FILE_PATH }}"
          $mainPath = "./main.py"
          $requirementsPath = "${{ matrix.requirements-path }}"

          Write-Host "Checking required files..."
          Write-Host "Icon: $iconPath"
          Write-Host "Splash: $splashPath" 
          Write-Host "Main script: $mainPath"
          Write-Host "Requirements: $requirementsPath"

          if (!(Test-Path $iconPath)) {
            Write-Error "❌ Icon file not found: $iconPath"
            exit 1
          }
          if (!(Test-Path $splashPath)) {
            Write-Error "❌ Splash screen file not found: $splashPath"
            exit 1
          }
          if (!(Test-Path $mainPath)) {
            Write-Error "❌ Main script not found: $mainPath"
            exit 1
          }
          if (!(Test-Path $requirementsPath)) {
            Write-Error "❌ Requirements file not found: $requirementsPath"
            exit 1
          }

          Write-Host "All required files found"
        shell: pwsh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-arch }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.python-arch }}-${{ hashFiles(matrix.requirements-path) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.python-arch }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          Write-Host "Installing dependencies from: ${{ matrix.requirements-path }}"
          pip install -r "${{ matrix.requirements-path }}"
        shell: powershell

      - name: Build with Nuitka
        if: matrix.os == 'windows-latest'
        run: |
          # Create build directory
          $buildPath = "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}"
          $appName = "${{ env.APP_NAME }}${{ matrix.script-ext }}"
          New-Item -ItemType Directory -Force -Path $buildPath
          
          Write-Host "Starting Nuitka build for ${{ matrix.python-version }} (${{ matrix.python-arch }})..."
          Write-Host "Build output: $buildPath"

          $nuitkaArgs = @(
            "--mode=onefile"
            "--windows-console-mode=disable"
            "--assume-yes-for-downloads"
            "--include-package=wx"
            "--include-package-data=wx"
            "--noinclude-unittest-mode=nofollow"
            "--noinclude-setuptools-mode=nofollow"
            "--company-name=${{ env.COMPANY_NAME }}"
            "--product-name=${{ env.APP_NAME }}"
            "--windows-file-version=${{ env.FILE_VERSION }}"
            "--windows-product-version=${{ env.PRODUCT_VERSION }}"
            "--output-dir=$buildPath"
            "--output-filename=$appName"
            "--windows-icon-from-ico=${{ env.ICON_FILE_PATH }}"
            "--onefile-windows-splash-screen-image=${{ env.SPLASH_SCREEN_FILE_PATH }}"
            "./main.py"
          )

          Write-Host "Nuitka command: python -m nuitka $nuitkaArgs"
          python -m nuitka @nuitkaArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Nuitka build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        shell: powershell

      - name: Verify build result
        run: |
          $exePath = "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/${{ env.APP_NAME }}${{ matrix.script-ext }}"
          Write-Host "Verifying build result: $exePath"
          
          if (Test-Path $exePath) {
            $fileInfo = Get-Item $exePath
            $fileSize = [math]::Round($fileInfo.Length / 1MB, 2)
            Write-Host "✓ Build successful!"
            Write-Host "  File: $($fileInfo.Name)"
            Write-Host "  Size: $fileSize MB"
            Write-Host "  Path: $($fileInfo.FullName)"
            Write-Host "  Modified: $($fileInfo.LastWriteTime)"
          } else {
            Write-Error "❌ Build failed: Executable not found at $exePath"
            # List directory contents for debugging
            Write-Host "Directory contents:"
            Get-ChildItem "./${{ env.BUILD_DIR }}/${{ matrix.build-dir }}/" -Recurse | Format-Table Name, Length
            exit 1
          }
        shell: pwsh

      - name: Upload asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ format('./{0}/{1}/{2}{3}', env.BUILD_DIR, matrix.build-dir, env.APP_NAME, matrix.script-ext) }}
          asset_name: ${{ format('{0}-{1}-{2}-{3}{4}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name, matrix.script-ext) }}
          asset_content_type: application/octet-stream

      - name: Show upload confirmation
        run: |
          $assetName = "${{ format('{0}-{1}-{2}-{3}{4}', env.APP_NAME, matrix.os-name, matrix.python-arch, github.ref_name, matrix.script-ext) }}"
          Write-Host "Asset uploaded successfully: $assetName"
        shell: powershell